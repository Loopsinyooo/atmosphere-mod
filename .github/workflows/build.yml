name: Build Atmosphere

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-disabled: true

      - name: Check versions
        run: |
          java -version
          gradle --version

      - name: Build
        run: gradle clean build --no-daemon --refresh-dependencies --stacktrace

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Atmosphere-1.21.11
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
